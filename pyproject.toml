[project]
name = "bible-reader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Namore-Tech", email = "ddonne500@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "jinja2>=3.1.6",
    "numpy>=2.2.6",
    "pyaudio>=0.2.14",
    "rapidfuzz>=3.14.5",
    "scipy>=1.15.3",
    "word2number>=1.1",
]

[project.scripts]
bible-reader = "bible_reader:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
